<!-- ============ ONBOARDING / PROFILE SETUP MODAL ============ -->

<div id="onboarding-overlay" class="modal-overlay hidden" aria-hidden="true">

  <section class="modal-card" role="dialog" aria-labelledby="onboarding-title">

    <div class="modal-icon">
      <i class="fa-solid fa-brain"></i>
    </div>

    <h2 id="onboarding-title">Welcome to WellTrack</h2>

    <p class="modal-sub">
      Your personal burnout detection &amp; well-being companion.
      Let's set up your profile.
    </p>

    <form id="onboarding-form" autocomplete="off">

      <label for="ob-name">Your Name</label>
      <input
        type="text"
        id="ob-name"
        required
        maxlength="60"
      >

      <label for="ob-email">Email Address</label>
      <input
        type="email"
        id="ob-email"
        required
        maxlength="100"
      >

      <label for="ob-course">Course / Program</label>
      <input
        type="text"
        id="ob-course"
        required
        maxlength="80"
      >

      <label for="ob-year">Class / Academic Year</label>
      <select id="ob-year" required>
        <option value="" disabled selected>Select class</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
        <option>5th Year</option>
        <option>Postgraduate</option>
        <option>Other</option>
      </select>

      <button type="submit" class="btn btn-primary btn-block">
        <i class="fa-solid fa-rocket"></i>
        Start Tracking
      </button>

    </form>

  </section>
</div>


<!-- ============ PROFILE EDIT MODAL ============ -->

<div id="profile-overlay" class="modal-overlay hidden" aria-hidden="true">

  <section
    class="modal-card profile-modal"
    role="dialog"
    aria-labelledby="profile-title"
  >

    <button
      class="modal-close"
      id="profile-close"
      aria-label="Close"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="profile-header">

      <div class="profile-avatar">
        <i class="fa-solid fa-user"></i>
      </div>

      <div>
        <h2 id="profile-title">Your Profile</h2>
        <p class="muted">
          Manage your WellTrack profile information.
        </p>
      </div>

    </div>


    <form id="profile-form" autocomplete="off">

      <div class="field">

        <label for="pf-name">
          <i class="fa-solid fa-user"></i>
          Name
        </label>

        <input
          type="text"
          id="pf-name"
          required
          maxlength="60"
        >

      </div>


      <div class="field">

        <label for="pf-email">
          <i class="fa-solid fa-envelope"></i>
          Email Address
        </label>

        <input
          type="email"
          id="pf-email"
          required
          maxlength="100"
        >

      </div>


      <div class="field">

        <label for="pf-course">
          <i class="fa-solid fa-graduation-cap"></i>
          Course / Program
        </label>

        <input
          type="text"
          id="pf-course"
          required
          maxlength="80"
        >

      </div>


      <div class="field">

        <label for="pf-year">
          <i class="fa-solid fa-school"></i>
          Class / Academic Year
        </label>

        <select id="pf-year" required>

          <option value="" disabled>
            Select class
          </option>

          <option>1st Year</option>
          <option>2nd Year</option>
          <option>3rd Year</option>
          <option>4th Year</option>
          <option>5th Year</option>
          <option>Postgraduate</option>
          <option>Other</option>

        </select>

      </div>


      <div class="profile-actions">

        <button
          type="submit"
          class="btn btn-primary btn-block"
        >
          <i class="fa-solid fa-floppy-disk"></i>
          Save Changes
        </button>

        <button
          type="button"
          id="reset-data-btn"
          class="btn btn-danger btn-block"
        >
          <i class="fa-solid fa-trash"></i>
          Reset All Data
        </button>

      </div>

    </form>

  </section>

</div>
